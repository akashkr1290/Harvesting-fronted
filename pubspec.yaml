name: harvest_flow
description: Harvesting Planning, Purchase, Sales & Logistics Workflow System
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino texts and date pickers in Indian languages.
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  # "any": flutter_localizations pins the exact intl version of your Flutter SDK.
  intl: any
  image_picker: ^1.1.2
  http: ^1.2.2
  share_plus: ^7.2.2
  shared_preferences: ^2.3.2
  qr_flutter: ^4.1.0
  # Simple mode: read screens aloud, speak numbers instead of typing,
  # crop pictures, and the call-for-help button.
  flutter_tts: ^4.2.0
  speech_to_text: ^7.0.0
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
