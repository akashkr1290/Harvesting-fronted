version: 1
frontend:
  phases:
    preBuild:
      commands:
        - git clone https://github.com/flutter/flutter.git -b stable --depth 1
        - export PATH="$PATH:`pwd`/flutter/bin"
        - flutter doctor
        - flutter pub get
    build:
      commands:
        # Set API_BASE_URL (and optionally HELPLINE_NUMBER) in Amplify Console > Environment variables.
        - 'if [ -z "$API_BASE_URL" ]; then echo "API_BASE_URL is not set in Amplify environment variables"; exit 1; fi'
        - flutter build web --release --dart-define=API_BASE_URL=$API_BASE_URL --dart-define=HELPLINE_NUMBER=${HELPLINE_NUMBER:-}
  artifacts:
    baseDirectory: build/web
    files:
      - '**/*'
  cache:
    paths:
      - .pub-cache/**/*
